const bodyM=new THREE.MeshLambertMaterial({color:0xaa2e2e}),headM=new THREE.MeshLambertMaterial({color:0xe0b48a});

const l=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.3),bodyM);l.position.y=.25;[b,h,l].forEach(m=>m.userData.e=e);e.add(b,h,l);
if(spawns.length){let q,tries=0;do{q=spawns[Math.random()*spawns.length|0];tries++}while(Math.hypot(q[0]-P.pos.x,q[1]-P.pos.z)<14&&tries<30);e.position.set(q[0],0,q[1])}else{const a=Math.random()*6.28,r=A-3;e.position.set(Math.cos(a)*r,0,Math.sin(a)*r)}resolve(e.position,.4);
e.hp=40+wave*5;e.cd=1+Math.random()*2;e.sp=2+Math.random()*1.2+wave*.1;S.add(e);enemies.push(e)}

function setZoom(z){if(z&&WS[cw]&&WS[cw].melee)z=false;zoom=z;fovT=z?(WS[cw]&&WS[cw].zoomFov||38):75;$('cross').style.transform=z?'scale(.45)':'';$('cross').style.borderColor=z?'#fffd':'#fff8'}
function reset(){setZoom(false);enemies.forEach(e=>S.remove(e));enemies=[];wave=0;score=0;kills=0;Object.assign(P,{hp:100,rel:0,cd:0,yaw:0,pitch:0});WS.forEach(w=>w.ammo=w.mag);sel(1);if(mapCur=='office'&&MAPS.start)P.pos.set(MAPS.start[0],1.7,MAPS.start[1]);else P.pos.set(0,1.7,0);nextWave()}
const ray=new THREE.Raycaster(),flash=$('flash');
function hurt(d){P.hp-=d;flash.style.opacity=.5;setTimeout(()=>flash.style.opacity=0,120);if(P.hp<=0){P.hp=0;end()}}
function dmgEnemy(e,amt,hd){e.hp-=amt;e.children.forEach(c=>{if(!c.userData.cl){c.material=c.material.clone();c.userData.cl=1}c.material.emissive.setHex(0x992222)});setTimeout(()=>e.children.forEach(c=>c.material.emissive.setHex(0)),80);
if(e.hp<=0&&enemies.includes(e)){S.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;score+=hd?150:100;P.hp=Math.min(100,P.hp+8);if(!enemies.length)setTimeout(()=>playing&&nextWave(),1500)}}
function explode(pt){const m=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),new THREE.MeshBasicMaterial({color:0xffaa33,transparent:true,opacity:.8}));m.position.copy(pt);S.add(m);fx.push({m,t:0});

function shoot(){const w=WS[cw];if(P.cd>0||P.rel>0)return;if(w.ammo<=0){reload();return}

if(w.melee){ray.setFromCamera({x:0,y:0},C);const hh=ray.intersectObjects([...solid,...enemies],true);gun.rotation.x=.9;setTimeout(()=>gun.rotation.x=0,120);if(hh.length&&hh[0].distance<w.range){const o=hh[0].object;if(o.userData.e){const hd=o.userData.head;dmgEnemy(o.userData.e,hd?w.dmg*2:w.dmg,hd)}}w.ammo=w.mag;fire=false;return}

for(let i=0;i<n;i++){
ray.setFromCamera({x:(Math.random()-.5)*sp,y:(Math.random()-.5)*sp},C);
const hits=ray.intersectObjects([...solid,...enemies],true);
if(w.rocket){explode(hits.length?hits[0].point:C.position.clone().add(ray.ray.direction.clone().multiplyScalar(60)));fire=false;return}
if(hits.length){const o=hits[0].object;if(o.userData.e){const hd=o.userData.head;dmgEnemy(o.userData.e,hd?w.dmg*2:w.dmg,hd)}}}
if(!w.auto)fire=false}

function sel(i){cw=i;WS.forEach((w,j)=>w.obj.visible=j==i);P.rel=0;P.cd=.25;if(zoom)setZoom(true)}
function end(){playing=false;setZoom(false);if(document.pointerLockElement)document.exitPointerLock();$('msg').textContent='Ти загинув! Хвиля '+wave+' · Вбито '+kills+' · Рахунок '+score;$('go').textContent='ЩЕ РАЗ';$('ov').style.display='flex'}
// input
let pick='arena';document.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{pick=b.dataset.m;document.querySelectorAll('.mb').forEach(x=>x.classList.toggle('on',x==b))});
$('go').onclick=async()=>{$('go').disabled=true;const t=$('go').textContent;$('go').textContent='Завантаження…';try{if(pick=='office')await buildOffice();else buildArena()}catch(e){buildArena()}$('go').disabled=false;$('go').textContent=t;reset();playing=true;$('ov').style.display='none';if(!touch)R.domElement.requestPointerLock()};
if(touch){$('ctl').textContent='Лівий палець — рух · правий — приціл · кнопки — вогонь/перезарядка · подвійний тап справа — приціл (зближення)';$('bf').style.display=$('br').style.display=$('bs').style.display='flex'}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='KeyR')reload();if(e.code=='Digit1')sel(0);if(e.code=='Digit2')sel(1);if(e.code=='Digit3')sel(2);if(e.code=='Digit4')sel(3);if(e.code=='Digit5')sel(4);if(e.code=='Digit6')sel(5);if(e.code=='Digit7')sel(6);if(e.code=='Digit8')sel(7);if(e.code=='Digit9')sel(8);if(e.code=='Digit0')sel(9)});addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousemove',e=>{if(document.pointerLockElement){const zk=zoom?.5:1;P.yaw-=e.movementX*.0022*zk;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-e.movementY*.0022*zk))}});

const tch={};
addEventListener('touchstart',e=>{for(const t of e.changedTouches){const el=document.elementFromPoint(t.clientX,t.clientY);if(el&&el.id=='bf'){fire=true;tch[t.identifier]='f'}else if(el&&el.id=='br'){reload();tch[t.identifier]='r'}else if(el&&el.id=='bs'){sel((cw+1)%WS.length);tch[t.identifier]='r'}else if(t.clientX<innerWidth/2){tch[t.identifier]={m:1,x:t.clientX,y:t.clientY}}else{const now=performance.now();if(playing&&now-lastTap<320&&Math.hypot(t.clientX-lastTapX,t.clientY-lastTapY)<60){setZoom(!zoom);lastTap=0}else{lastTap=now;lastTapX=t.clientX;lastTapY=t.clientY}tch[t.identifier]={l:1,x:t.clientX,y:t.clientY}}}},{passive:true});

if(playing){

}
